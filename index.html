<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hororová Databáze</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Hororová Databáze</h1>
        <div class="line"></div>
        <nav class="tabs">
            <h2 class="active">[ Viděli jsme ]</h2>
            <h2>[ Chceme vidět ]</h2>
        </nav>
        <div class="line"></div>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" placeholder="Hledat horor...">
        </div>

        <section class="film-grid">
            <div class="film-card">
                <div class="poster-wrapper">
                    <img src="https://m.media-amazon.com/images/M/MV5BMTAzMDk1ODIyNDleQTJeQWpwZ15BbWU4MDAzNzY1MzMx._V1_.jpg" alt="Plakát">
                    <span class="year">2014</span>
                </div>
                
                <div class="film-info">
                    <h3>The Pyramid</h3>
                    <p class="description">Archeologové uvíznou v pyramidě a zjišťují, že nejsou sami...</p>
                    
                    <div class="ratings">
                        <div class="rating-bubble honza">
                            <span class="author">Honza</span>
                            <span class="score">5/10</span>
                        </div>
                        <div class="rating-bubble barca">
                            <span class="author">Barča</span>
                            <span class="score">4/10</span>
                        </div>
                    </div>
                </div>
            </div>

            </section>
    </main>

    <footer>
        <p>© 2026 Jan Čáp | GitHub <img src="Pictures/icons8-github-48.png" alt="GitHub" width="15"></p>
    </footer>
</body>
</html>
